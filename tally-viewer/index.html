<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Offline TallyPrime companion: open Tally data folders, dashboards, ledgers, day book, GST and reports on your phone.">
  <meta name="theme-color" content="#07080B">
  <meta name="mobile-web-app-capable" content="yes">

    <div class="skeleton" style="height:62px;border-radius:14px;margin-bottom:8px" aria-hidden="true"></div>

  <nav class="nav" id="nav" aria-label="Main"></nav>
